[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epson-tm-t88v"
version = "0.1.0"
description = "Driver for the Epson TM-T88V thermal receipt printer over /dev/usb/lp*"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Only needed to load JPEG/PNG/etc. Raw 1-bit and grayscale buffers work without it.
images = ["pillow"]

[project.scripts]
tm-t88v-probe = "epson_tm_t88v.tools.probe:main"
tm-t88v-calibrate = "epson_tm_t88v.tools.calibrate:main"

[tool.setuptools.packages.find]
where = ["src"]
